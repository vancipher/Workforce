<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3f33" />
    <title>Workforce Project — Offline</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at 20% 10%, #1f2937, #0b1220 60%);
        color: #e5e7eb;
      }
      .card {
        width: min(92vw, 460px);
        border-radius: 18px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.84);
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.3rem;
      }
      p {
        margin: 8px 0 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Workforce Project is installed and will work again when you are back online.</p>
      <p>Please reconnect to load the latest employee records and documents.</p>
    </main>
  </body>
</html>
